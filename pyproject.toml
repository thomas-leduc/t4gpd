[build-system]
# requires = ["setuptools>=77", "wheel"]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "t4gpd"
description = "Set of tools based on Python, GeoPandas and Shapely to achieve urban geoprocessing"
authors = [
    { name = "Thomas Leduc", email = "thomas.leduc@crenau.archi.fr" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering"
]
keywords = ["Geospatial analysis", "Urban form", "Urban morphology", "Isovist"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE*"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
    # "geopandas>=0.12.2",
    # "laspy>=2.0",
    # "matplotlib>=3.6",
    # "meshio>=5.0",
    # "networkx>=2.8",
    # "numpy>=1.23",
    # "pdal>=3.0",
    # "pvlib>=0.10",
    # "pysolar>=0.10",
    # "pyvista>=0.40",
    # "rasterio>=1.3",
    # "scipy>=1.9",
    # "windrose>=1.8"
]
version = "1.0.0"

[project.urls]
Homepage = "https://t4gpd-docs.readthedocs.io"
Documentation = "https://t4gpd-docs.readthedocs.io"
Download = "https://pypi.org/project/t4gpd"
Repository = "https://github.com/thomas-leduc/t4gpd"

[tool.setuptools.packages.find]
exclude = ["tests*", "t4gpd.future*"]
